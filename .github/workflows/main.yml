name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame buildozer cython

    - name: Create clean buildozer.spec
      run: |
        echo "[app]" > buildozer.spec
        echo "title = Neon Box Shoot" >> buildozer.spec
        echo "package.name = neonboxshoot" >> buildozer.spec
        echo "package.domain = org.neonbox" >> buildozer.spec
        echo "source.file = (invalid) (3)" >> buildozer.spec
        echo "source.dir = ." >> buildozer.spec
        echo "version = 0.1" >> buildozer.spec
        echo "source.include_exts = py,png,jpg,kv,atlas,3" >> buildozer.spec
        echo "requirements = python3,pygame" >> buildozer.spec
        echo "orientation = landscape" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.min_api = 21" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
