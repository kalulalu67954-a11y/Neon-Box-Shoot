name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame buildozer cython

    - name: Initialize Buildozer
      run: |
        buildozer init

    - name: Fix Buildozer spec for Pygame
      run: |
        sed -i 's/# title = My Application/title = Neon Box Shoot/' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = neonboxshoot/' buildozer.spec
        sed -i 's/#package.domain = org.test/package.domain = org.neonbox/' buildozer.spec
        sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,3/' buildozer.spec
        sed -i 's/source.main = main.py/source.main = (invalid) (3)/' buildozer.spec
        sed -i 's/#requirements = python3,pygame/requirements = python3,pygame/' buildozer.spec
        sed -i 's/#orientation = portrait/orientation = landscape/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: package
        path: bin/*.apk
